<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard - InternBoot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "intern-blue": "#2563eb",
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside
      id="sidebar"
      class="w-64 bg-white border-r border-slate-200 h-full flex-shrink-0 transition-transform absolute lg:relative z-40 -translate-x-full lg:translate-x-0"
    >
      <div class="h-16 flex items-center px-6 border-b border-slate-200">
        <img
          src="../assets/internboot-logo.png"
          alt="InternBoot Logo"
          class="h-8"
        />
      </div>
      <nav class="p-4 space-y-1">
        <a
          href="index.html"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition"
          ><i data-lucide="layout-dashboard" class="h-5 w-5"></i> Dashboard</a
        >
        <a
          href="candidates.html"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition"
          ><i data-lucide="users" class="h-5 w-5"></i> Candidates</a
        >
        <a
          href="results.html"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition"
          ><i data-lucide="file-check-2" class="h-5 w-5"></i> Results</a
        >
        <a
          href="certificates.html"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition"
          ><i data-lucide="award" class="h-5 w-5"></i> Certificates</a
        >
        <a
          href="questions.html"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition"
          ><i data-lucide="help-circle" class="h-5 w-5"></i> Questions</a
        >
        <a
          href="batches.html"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition"
          ><i data-lucide="calendar-days" class="h-5 w-5"></i> Batches</a
        >
        <a
          href="placement.html"
          class="flex items-center gap-3 px-3 py-2 rounded-lg bg-intern-blue font-medium text-white transition"
          ><i data-lucide="building-2" class="h-5 w-5"></i> Placement</a
        >
      </nav>
    </aside>

    <!-- Overlay -->
    <div
      id="sidebarOverlay"
      class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden"
    ></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
      <!-- Header -->
      <header
        class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0"
      >
        <div class="flex items-center gap-4">
          <button
            id="menuButton"
            class="lg:hidden text-slate-500 hover:text-slate-700"
          >
            <i data-lucide="menu" class="h-6 w-6"></i>
          </button>
          <h1 class="text-xl font-semibold text-slate-800">Admin Dashboard</h1>
        </div>

        <div class="flex items-center gap-4 relative">
          <button
            id="notificationButton"
            class="text-slate-500 hover:text-slate-700 relative"
          >
            <i data-lucide="bell" class="h-5 w-5"></i>
          </button>
          <div
            id="notificationDropdown"
            class="hidden absolute right-12 top-full mt-2 w-64 bg-white rounded-xl shadow-lg border border-slate-100 p-4 z-50"
          >
            <p class="text-sm text-slate-500 text-center">
              No new notifications
            </p>
          </div>

          <button id="userButton" class="flex items-center gap-2">
            <div
              id="adminAvatar"
              class="h-8 w-8 rounded-full bg-intern-blue text-white flex items-center justify-center font-medium overflow-hidden"
            >
              <span id="adminAvatarInitial">A</span>
              <img
                id="adminAvatarImage"
                src=""
                alt="Avatar"
                class="h-full w-full object-cover hidden"
              />
            </div>
            <span
              id="adminHeaderName"
              class="text-sm font-medium text-slate-700 hidden sm:block"
              >Admin</span
            >
            <i data-lucide="chevron-down" class="h-4 w-4 text-slate-400"></i>
          </button>

          <div
            id="userDropdown"
            class="hidden absolute right-0 top-full mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-100 py-1 z-50"
          >
            <a
              href="setting.html"
              class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
              >Profile</a
            >
            <div class="border-t border-slate-100 my-1"></div>
            <a
              href="#"
              class="block px-4 py-2 text-sm text-red-600 hover:bg-slate-50"
              >Logout</a
            >
          </div>
        </div>
      </header>

      <!-- Main Scrollable Area -->
      <main class="flex-1 overflow-auto bg-slate-50">
        <div class="p-6">
          <h2 class="text-2xl font-semibold text-slate-800 mb-6">Placements</h2>

          <div
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-3 mb-8"
          >
            <div
              class="bg-white px-4 py-4 rounded-2xl shadow-sm border border-slate-100"
            >
              <p class="text-sm text-slate-500 mb-1">Total</p>
              <h3
                class="text-2xl font-bold text-amber-500"
                id="placementReadyCount"
              >
                0
              </h3>
            </div>
            <div
              class="bg-white px-4 py-4 rounded-2xl shadow-sm border border-slate-100"
            >
              <p class="text-sm text-slate-500 mb-1">Level 1</p>
              <h3
                class="text-2xl font-bold text-slate-800"
                id="placementLevel1Count"
              >
                0
              </h3>
            </div>
            <div
              class="bg-white px-4 py-4 rounded-2xl shadow-sm border border-slate-100"
            >
              <p class="text-sm text-slate-500 mb-1">Level 2</p>
              <h3
                class="text-2xl font-bold text-slate-800"
                id="placementLevel2Count"
              >
                0
              </h3>
            </div>
            <div
              class="bg-white px-4 py-4 rounded-2xl shadow-sm border border-slate-100"
            >
              <p class="text-sm text-slate-500 mb-1">Level 3</p>
              <h3
                class="text-2xl font-bold text-slate-800"
                id="placementLevel3Count"
              >
                0
              </h3>
            </div>
            <div
              class="bg-white px-4 py-4 rounded-2xl shadow-sm border border-slate-100"
            >
              <p class="text-sm text-slate-500 mb-1">Level 4</p>
              <h3
                class="text-2xl font-bold text-slate-800"
                id="placementLevel4Count"
              >
                0
              </h3>
            </div>
            <div
              class="bg-white px-4 py-4 rounded-2xl shadow-sm border border-slate-100"
            >
              <p class="text-sm text-slate-500 mb-1">Level 5</p>
              <h3
                class="text-2xl font-bold text-slate-800"
                id="placementLevel5Count"
              >
                0
              </h3>
            </div>
            <div
              class="bg-white px-4 py-4 rounded-2xl shadow-sm border border-slate-100"
            >
              <p class="text-sm text-slate-500 mb-1">Placed</p>
              <h3 class="text-2xl font-bold text-green-600" id="placedCount">
                0
              </h3>
            </div>
          </div>

          <div
            class="mt-8 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"
          >
            <div
              class="p-4 border-b border-slate-100 flex flex-wrap gap-4 items-center bg-slate-50/50"
            >
              <div class="flex-1 min-w-[200px] relative">
                <i
                  data-lucide="search"
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 h-4 w-4"
                ></i>
                <input
                  type="text"
                  id="placementSearch"
                  placeholder="Search candidates..."
                  class="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-intern-blue/20"
                />
              </div>
              <select
                id="placementLevelFilter"
                class="px-3 py-2 rounded-lg border border-slate-200 text-sm bg-white min-w-[140px]"
              >
                <option value="">All Levels</option>
                <option value="level 1">Level 1</option>
                <option value="level 2">Level 2</option>
                <option value="level 3">Level 3</option>
                <option value="level 4">Level 4</option>
                <option value="level 5">Level 5</option>
              </select>
              <button
                id="exportPlacementCsvBtn"
                class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 text-sm font-medium hover:bg-slate-50 hover:border-slate-300 transition shadow-sm"
                title="Export placement list as CSV"
              >
                <i data-lucide="download" class="h-4 w-4 text-slate-500"></i>
                <span>Export CSV</span>
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                  <tr>
                    <th class="px-6 py-3 font-medium">Candidate</th>
                    <th class="px-6 py-3 font-medium">Level</th>
                    <th class="px-6 py-3 font-medium">Score</th>
                    <th class="px-6 py-3 font-medium">Company</th>
                    <th class="px-6 py-3 font-medium w-24">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <tr id="emptyPlacement">
                    <td
                      class="px-6 py-12 text-center text-sm text-slate-600"
                      colspan="5"
                    >
                      No candidates found
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
